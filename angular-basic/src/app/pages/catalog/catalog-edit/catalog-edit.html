<nz-spin [nzSpinning]="loading()">
  <form nz-form nzLayout="vertical" [formGroup]="catalogForm" (ngSubmit)="submitForm()">
    <nz-form-item>
      <nz-form-label nzRequired nzFor="name">Name</nz-form-label>
      <nz-form-control nzErrorTip="Please enter a name">
        <input nz-input id="name" formControlName="name" placeholder="Name" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzFor="description">Description</nz-form-label>
      <nz-form-control>
        <textarea nz-input id="description" formControlName="description" rows="3" placeholder="Optional description"></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="modal-actions">
      <button nz-button type="button" (click)="destroyModal()" [disabled]="saving()">Cancel</button>
      <button nz-button nzType="primary" type="submit" [nzLoading]="saving()" [disabled]="loading()">
        {{ data.itemId === undefined ? 'Create' : 'Save changes' }}
      </button>
    </div>
  </form>
</nz-spin>
