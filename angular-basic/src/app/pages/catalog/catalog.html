<div class="catalog-container">
  <div class="page-header">
    <h1>{{ title }}</h1>
    <button nz-button nzType="primary" (click)="openForm()">
      <nz-icon nzType="plus" nzTheme="outline"></nz-icon>
      Add {{ catalogType === 'categories' ? 'category' : 'weight' }}
    </button>
  </div>

  <nz-table
    #catalogTable
    [nzData]="catalogData"
    [nzLoading]="isLoading"
    [nzPageSize]="10"
    [nzShowTotal]="totalTemplate"
  >
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th nzWidth="120px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of catalogTable.data">
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.description || '-' }}</td>
        <td>
          <button nz-button nzType="link" nzSize="small" (click)="openForm(item)" [attr.aria-label]="'Edit ' + item.name">
            <nz-icon nzType="edit" nzTheme="outline"></nz-icon>
          </button>
          <button nz-button nzType="link" nzSize="small" nzDanger (click)="confirmDelete(item)" [attr.aria-label]="'Delete ' + item.name">
            <nz-icon nzType="delete" nzTheme="outline"></nz-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>

  <ng-template #totalTemplate let-total>
    Total {{ total }} items
  </ng-template>
</div>
